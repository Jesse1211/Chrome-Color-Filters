<!doctype html><html><head><meta charset="utf-8"><title>T0 fixture</title>
<style>
  body{margin:0;font:14px system-ui;}
  #spacer{height:4000px;background:linear-gradient(#f00,#00f);}
  #hdr{position:fixed;top:0;left:0;right:0;height:60px;background:#0a0;color:#fff;}
  #side{position:fixed;bottom:20px;right:20px;width:120px;height:80px;background:#f0f;}
  #stick{position:sticky;top:60px;height:40px;background:#ff0;}
  #inner{position:relative;}
</style></head>
<body>
  <div id="hdr">FIXED HEADER</div>
  <div id="inner"><div id="stick">STICKY</div><div id="spacer"></div></div>
  <div id="side">FIXED SIDE</div>
</body></html>
